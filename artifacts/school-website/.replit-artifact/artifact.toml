kind = "web"
previewPath = "/"
title = "School Website"
description = "A modern responsive school website for prospective families, current students, and the wider school community. It presents the school's story, academics, campus life, admissions information, news, and contact details in a welcoming, easy-to-navigate experience."
version = "1.0.0"
id = "artifacts/school-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21294

[services.development]
run = "pnpm --filter @workspace/school-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/school-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21294"
BASE_PATH = "/"
